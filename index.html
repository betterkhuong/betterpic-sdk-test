<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterPic SDK Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .header {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 8px;
      }
      #betterpic-container {
        background: white;
        border-radius: 8px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="betterpic-container"></div>

    <!-- Load SDK from your local Nuxt app -->
    <script src="https://betterpic.io/sdk/photoshoot.js"></script>
    <!-- <script src="http://localhost:3502/sdk/photoshoot.js"></script> -->
    <script>
      // Initialize the SDK
      const sdk = BetterPicSDK.init({
        containerId: "betterpic-container",
        height: "800px",
        // Must haves
        affiliateId: "my_dub_id",
        partnerId: "532ee82d-1d9b-48d1-8831-b1e2b2175d85",
        // optional
        primaryColor: "37 197 94", // RGB values
        logoUrl:
          "https://img.freepik.com/vector-premium/vector-logo-facebook-vector-logo-oficial-facebook-ilustrador-logo-facebook_1002350-1803.jpg",
        // staging or production
        // mode: "staging",
      });
    </script>
  </body>
</html>
